services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${NOVA_BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - NOVA_DB_PATH=/data/nova.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${NOVA_FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_BASE_URL=/api
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
