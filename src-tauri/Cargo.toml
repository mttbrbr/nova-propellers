[package]
name = "nova-propellers"
version = "0.1.0-alpha.2"
description = "Linux desktop workbench for propeller design and analysis"
authors = ["mttbrbr"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "nova_propellers_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
