name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_licenses.py
      - run: python tools/check_source_archive.py
      - uses: fsfe/reuse-action@v5

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --requirement requirements-dev.txt
      - run: ruff check .
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    needs: [compliance, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up --detach
      - name: Smoke test services
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/api/health >/dev/null \
              && curl --fail --silent http://localhost:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend frontend
          exit 1
      - if: always()
        run: docker compose down --volumes
