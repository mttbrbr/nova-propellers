name: Build desktop executables

# Builds the Linux (Arch, Debian) and Windows executables only when you push a version tag (v*) or start
# it by hand from the Actions tab. Tags publish a GitHub Release with the files
# attached; a manual run leaves them as downloadable artifacts. No extra branches.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Arch package environment
        run: >-
          docker build
          --build-arg USER_ID="$(id -u)"
          --build-arg GROUP_ID="$(id -g)"
          --tag nova-tauri-arch-builder
          --file packaging/arch/Containerfile packaging/arch
      - name: Build and test Arch package
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/workspace"
          nova-tauri-arch-builder
          ./tools/package_arch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nova-propellers-arch-x86_64
          path: packaging/arch/*.pkg.tar.zst

  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - name: Build and test Debian package
        run: |
          ./tools/package_deb.sh
          python qa/smoke_desktop_backend.py \
            src-tauri/binaries/nova-backend-x86_64-unknown-linux-gnu
          python qa/smoke_workflow_backend.py \
            src-tauri/binaries/nova-backend-x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: nova-propellers-debian-x86_64
          path: src-tauri/target/debian/release/bundle/deb/*.deb

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows installer
        env:
          NOVA_DESKTOP_PYTHON: python
          NOVA_TAURI_TARGET: x86_64-pc-windows-msvc
        run: |
          npm ci --prefix frontend
          ./tools/build_desktop_backend.sh
          python qa/smoke_desktop_backend.py \
            src-tauri/binaries/nova-backend-x86_64-pc-windows-msvc.exe
          cd src-tauri
          ../frontend/node_modules/.bin/tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: nova-propellers-windows-x86_64
          path: src-tauri/target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [arch, debian, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nova-propellers-*-x86_64
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.deb *.pkg.tar.zst *.exe > SHA256SUMS
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Nova Propellers $GITHUB_REF_NAME"
          fi
